<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StockFlow - Login</title>
</head>
<body>
    <h1>Welcome to StockFlow</h1>

    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}

    <form method="post">
        {% csrf_token %}
        <label>Email</label>
        <input type="email" name="email" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button type="submit">Log In</button>
    </form>

    <p>New here?
        <a href="{% url 'signup' %}">Create account</a>
    </p>
</body>
</html>
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Arial,sans-serif;background:#f1f5f9;color:#0f172a}
h1{color:#0f172a;margin-bottom:24px}
form{width:320px;max-width:85%;padding:28px;background:white;border-radius:12px;box-shadow:0 4px 20px #00000012}
label{display:block;margin:12px 0 6px}
input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px;box-sizing:border-box}
button{width:100%;margin-top:20px;padding:12px;background:#2563eb;color:white;border:0;border-radius:8px;cursor:pointer}
a{color:#2563eb}
</style>
