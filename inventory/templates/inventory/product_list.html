
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockFlow - Products</title>
</head>
<body>
    <h1>Product Inventory</h1>
    <form method="get">
        <input 
         type="text"
         name="search"
         placeholder="Search by product name or SKU..."
         value="{{ search_query }}"
        >
        <button type="submit">Search</button>
        <a href="{% url 'product_list' %}">Clear</a>
    </form>


    <p>
        <a href="{% url 'dashboard' %}">Dashboard</a>
        |
        <a href="{% url 'product_create' %}">Add Product</a>
    </p>

    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>Name</th>
                <th>SKU</th>
                <th>Quantity</th>
                <th>Price</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for product in products %}
            <tr>
                <td>{{ product.name }}</td>
                <td>{{ product.sku }}</td>
                <td>{{ product.quantity }}</td>
                <td>{{ product.selling_price|default_if_none:"—" }}</td>
                <td>
                   <a href="{% url 'product_edit' product.pk %}">Edit</a>
                   <a href="{% url 'product_delete' product.pk %}">Delete</a>

                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4">No products available.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        padding: 32px;
        font-family: Arial, sans-serif;
        background: #f1f5f9;
        color: #1e293b;
    }
    h1 {
        background: #0f172a;
        color: white;
        padding: 24px;
        border-radius: 12px;
        margin: 0 0 24px;
    }
    form {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 20px;
    }
    input {
        padding: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 15px;
    }
    button {
        padding: 12px 18px;
        background: #2563eb;
        color: white;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
    }
    a {
        color: #2563eb;
        text-decoration: none;
        margin-right: 12px;
    }
    table {
        width: 100%;
        margin-top: 20px;
        border-collapse: collapse;
        background: white;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 4px 12px #00000012;
    }
    th, td {
        padding: 14px;
        text-align: left;
        border-bottom: 1px solid #e2e8f0;
    }
    th {
        background: #e2e8f0;
        color: #334155;
    }
    tr:hover { background: #f8fafc; }
    @media (max-width: 650px) {
        body { padding: 16px; }
        table { font-size: 13px; }
        th, td { padding: 8px; }
    }
</style>
