
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockFlow - Products</title>
</head>
<body>
    <h1>Product Inventory</h1>
    <form method="get">
        <input 
         type="text"
         name="search"
         placeholder="Search by product name or SKU..."
         value="{{ search_query }}"
        >
        <button type="submit">Search</button>
        <a href="{% url 'product_list' %}">Clear</a>
    </form>


    <p>
        <a href="{% url 'dashboard' %}">Dashboard</a>
        |
        <a href="{% url 'product_create' %}">Add Product</a>
    </p>

    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>Name</th>
                <th>SKU</th>
                <th>Quantity</th>
                <th>Price</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for product in products %}
            <tr>
                <td>{{ product.name }}</td>
                <td>{{ product.sku }}</td>
                <td>{{ product.quantity }}</td>
                <td>{{ product.selling_price|default_if_none:"—" }}</td>
                <td>
                   <a href="{% url 'product_edit' product.pk %}">Edit</a>
                   <a href="{% url 'product_delete' product.pk %}">Delete</a>

                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4">No products available.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
