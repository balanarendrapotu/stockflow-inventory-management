
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Product</title>
</head>
<body>
    <h1>Delete Product</h1>

    <p>Are you sure you want to delete "{{ product.name }}"?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
    </form>

    <p>
        <a href="{% url 'product_list' %}">Cancel</a>
    </p>
</body>
</html>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    padding: 32px;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #1e293b;
}
h1 {
    background: #0f172a;
    color: white;
    padding: 24px;
    border-radius: 12px;
    margin: 0 0 24px;
}
body > p {
    max-width: 650px;
    padding: 24px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 12px #00000012;
    font-size: 17px;
}
form {
    max-width: 650px;
    margin-top: -12px;
    padding: 0 24px 24px;
    background: white;
}
button {
    padding: 12px 18px;
    background: #dc2626;
    color: white;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
}
a {
    display: inline-block;
    margin-top: 12px;
    color: #2563eb;
    text-decoration: none;
}
@media (max-width: 650px) {
    body { padding: 16px; }
}
</style>
